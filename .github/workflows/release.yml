# A tag v<version> releases Xcrew. Claude Code keeps people on a plugin's version until it
# changes, so the tag must match the version the plugin and the CLI declare. Installs follow the
# `stable` branch, which this workflow alone moves, to the tag, once every check on it passed.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - name: The tag matches the declared version
        run: |
          tag=${GITHUB_REF_NAME#v}
          plugin=$(jq -r .version .claude-plugin/plugin.json)
          swift=$(sed -n 's/.*current = "\(.*\)".*/\1/p' Sources/XcrewCore/XcrewVersion.swift)
          echo "tag $tag · plugin.json $plugin · XcrewVersion $swift"
          [ "$tag" = "$plugin" ] && [ "$tag" = "$swift" ]
          grep -q "^## $tag — [0-9]" CHANGELOG.md || { echo "CHANGELOG.md needs a dated '## $tag — <date>' entry"; exit 1; }
      # main only changes through pull requests that were green and up to date, so this
      # confirms the tag is that tested code instead of testing it again.
      - name: The tagged commit is what its pull request tested, and that passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo=$GITHUB_REPOSITORY
          pr_head=$(gh api "repos/$repo/commits/$GITHUB_SHA/pulls" -q '.[0].head.sha')
          [ -n "$pr_head" ] || { echo "$GITHUB_SHA didn't come from a pull request"; exit 1; }
          tagged_tree=$(gh api "repos/$repo/git/commits/$GITHUB_SHA" -q .tree.sha)
          tested_tree=$(gh api "repos/$repo/git/commits/$pr_head" -q .tree.sha)
          [ "$tagged_tree" = "$tested_tree" ] || { echo "$GITHUB_SHA differs from what its pull request tested ($pr_head)"; exit 1; }
          for check in "CI"; do
            conclusion=$(gh api "repos/$repo/commits/$pr_head/check-runs" -q "[.check_runs[] | select(.name == \"$check\")][0].conclusion")
            echo "$check: $conclusion"
            [ "$conclusion" = success ] || { echo "$check didn't pass on $pr_head"; exit 1; }
          done
      # Before the release is published, so `xcrew doctor` never names a release installs can't reach yet. GitHub
      # makes the update only as a fast-forward (`force=false`), and the ruleset on `stable` refuses anything else;
      # moving it to where it already is does nothing, so a rerun gets past it.
      - name: Point installs at this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/stable" -f sha="$GITHUB_SHA" -F force=false --silent
      # A rerun finds the release already published and goes on.
      - name: Publish the release with its changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && exit 0
          tag=${GITHUB_REF_NAME#v}
          awk -v v="$tag" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "Xcrew $tag" --notes-file notes.md
