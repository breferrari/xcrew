name: CI

# Runs once per change, on its pull request (or its merge-queue entry, once the repository has
# one). The ruleset only merges a pull request that is up to date with main and green, so main
# holds exactly what passed and needs no second run; the weekly canary covers main against new
# tools.
on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Markdown alone skips the jobs below, which then report as skipped and satisfy the
      # required checks. CHANGELOG.md, skills and the briefing are Markdown the tests read.
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          code=false
          for file in $(git diff --name-only "$BASE" HEAD); do
            case "$file" in
              CHANGELOG.md | skills/* | context/*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
          done
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  swift:
    name: Swift package
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(printf '%s\n' /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Test, with warnings as errors
        run: swift test -Xswiftc -warnings-as-errors

  plugin:
    name: Plugin and mod
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code
      - name: Validate the plugin
        run: claude plugin validate .
      - name: Test the mod
        run: claude plugin test .

  shell:
    name: Shell scripts
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        run: shellcheck bin/xcrew mcs/*.sh mcs/checks/*.sh scripts/*.sh
