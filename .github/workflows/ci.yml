name: CI

# Runs once per change, on its pull request (or its merge-queue entry, once the repository has
# one). The ruleset only merges a pull request that is up to date with main and green, so main
# holds exactly what passed and needs no second run; the weekly canary covers main against new
# tools.
on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      distribution: ${{ steps.diff.outputs.distribution }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Markdown alone skips the jobs below, which then report as skipped and satisfy the
      # required checks. CHANGELOG.md, skills and the briefing are Markdown the tests read.
      # A file a channel ships, the README among them, runs Distribution.
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          code=false
          distribution=false
          for file in $(git diff --name-only "$BASE" HEAD); do
            case "$file" in
              CHANGELOG.md | skills/* | context/*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
            case "$file" in
              .claude-plugin/* | techpack.yaml | mcs/* | README.md | assets/* | hooks/hooks.json | libexec/* | bin/* | Tests/ManifestTests/* | scripts/distribution.sh | .github/workflows/ci.yml) distribution=true ;;
            esac
          done
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
          echo "distribution=$distribution" | tee -a "$GITHUB_OUTPUT"

  swift:
    name: Swift package
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      # The test bed's fixtures, at the commit these tests expect: bump the SHA on purpose, with the tag beside it.
      - uses: actions/checkout@v5
        with:
          repository: breferrari/xcrew-testbed
          ref: 78d21e259a64691a08d8726aaba926da5b18e79e # v0.4.0
          path: xcrew-testbed
      - name: Use the newest Xcode on the runner
        run: |
          sudo xcode-select -s "$(printf '%s\n' /Applications/Xcode_*.app | sort -V | tail -1)"
          swift --version
      - name: Test, with warnings as errors
        run: swift test -Xswiftc -warnings-as-errors
        env:
          XCREW_TESTBED: ${{ github.workspace }}/xcrew-testbed

  # The oldest Swift Package.swift accepts, which a person's first build may use. Plain `swift test`: an older
  # compiler's warnings don't stop their build either.
  swift-floor:
    name: Swift package, oldest toolchain
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      # The test bed's fixtures, at the commit these tests expect: bump the SHA on purpose, with the tag beside it.
      - uses: actions/checkout@v5
        with:
          repository: breferrari/xcrew-testbed
          ref: 78d21e259a64691a08d8726aaba926da5b18e79e # v0.4.0
          path: xcrew-testbed
      - name: Use the oldest Xcode whose Swift is the one swift-tools-version names
        run: |
          floor=$(sed -n 's|^// swift-tools-version:||p' Package.swift)
          for app in $(printf '%s\n' /Applications/Xcode_*.app | sort -V); do
            version=$(DEVELOPER_DIR="$app/Contents/Developer" xcrun swift --version 2>/dev/null | sed -n 's/.*Swift version \([0-9.]*\).*/\1/p' | head -1)
            case $version in "$floor" | "$floor".*) chosen=$app; break ;; esac
          done
          if [ -z "${chosen:-}" ]; then echo "No Xcode on this runner has Swift $floor" >&2; exit 1; fi
          sudo xcode-select -s "$chosen"
          swift --version
      - name: Test
        run: swift test
        env:
          XCREW_TESTBED: ${{ github.workspace }}/xcrew-testbed

  plugin:
    name: Plugin and mod
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code
      - name: Test the mod
        run: claude plugin test .

  # Every channel xcrew ships through, one step each: what its installer or listing reads still holds. A new channel is
  # one more step and one more case in the script.
  distribution:
    name: Distribution
    needs: changes
    if: needs.changes.outputs.distribution == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Use the newest Xcode on the runner
        run: |
          sudo xcode-select -s "$(printf '%s\n' /Applications/Xcode_*.app | sort -V | tail -1)"
          swift --version
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code
      - name: Marketplace manifest
        run: scripts/distribution.sh marketplace
      - name: Directory listing
        run: scripts/distribution.sh listing
      - name: Techpack manifest
        run: scripts/distribution.sh techpack

  shell:
    name: Shell scripts
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        run: shellcheck bin/xcrew libexec/* mcs/*.sh mcs/checks/*.sh scripts/*.sh

  # The one check the ruleset and the release require. It needs every job above, so adding or renaming one never
  # touches either. Only the code jobs may be skipped, for a Markdown-only change, and Distribution, for a change no
  # channel ships: a failed or cancelled job fails it, and so does `changes` not succeeding, which would otherwise skip
  # everything.
  ci:
    name: CI
    needs: [changes, swift, swift-floor, plugin, distribution, shell]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed, or was skipped for a change it doesn't check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '.changes.result == "success" and ([to_entries[] | select(.key != "changes") | .value.result] | all(. == "success" or . == "skipped"))' >/dev/null
