# Runs xcrew against the newest Claude Code, MobileBuildMCP and Xcode every week, so upstream
# changes surface here, as an issue, before they surface in someone's session.
name: Canary

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Installs follow the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r tag published <<< "$(gh release view --json tagName,publishedAt --jq '.tagName + " " + .publishedAt')"
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$tag...stable" -q .status || true)
          scripts/stable-check.sh "$tag" "$published" "$(date -u +%s)" "$status" 2> "$RUNNER_TEMP/reasons" || { cat "$RUNNER_TEMP/reasons" >&2; exit 1; }
        shell: bash
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Use the newest Xcode on the runner
        run: |
          sudo xcode-select -s "$(printf '%s\n' /Applications/Xcode_*.app | sort -V | tail -1)"
          swift --version
      - name: Install the newest Claude Code and MobileBuildMCP
        run: |
          npm install --global @anthropic-ai/claude-code@latest
          brew install getsentry/xcodebuildmcp/mobilebuildmcp
          claude --version
          mobilebuildmcp --version
      - name: Claude Code still updates a plugin that follows a branch by its version
        run: scripts/stable-follows.sh 2> "$RUNNER_TEMP/reasons" || { cat "$RUNNER_TEMP/reasons" >&2; exit 1; }
      # The test bed's fixtures, at the commit CI pins: bump it there and here together.
      - uses: actions/checkout@v5
        with:
          repository: breferrari/xcrew-testbed
          ref: 85e8c7bbea5f6157602f31cee53f02472bff8063 # v0.5.0
          path: xcrew-testbed
      - name: Swift tests
        run: swift test
        env:
          XCREW_TESTBED: ${{ github.workspace }}/xcrew-testbed
      - name: Plugin validation and mod tests
        run: |
          claude plugin validate .
          claude plugin test .
      - name: xcrew reads back a result Claude Code saved to a file
        run: |
          scripts/saved-notice.sh "$(readlink -f "$(command -v claude)")" 2> "$RUNNER_TEMP/reasons" || { cat "$RUNNER_TEMP/reasons" >&2; exit 1; }
        shell: bash
      - name: xcrew still reads the coverage xccov gives
        run: scripts/coverage-shape.sh 2> "$RUNNER_TEMP/reasons" || { cat "$RUNNER_TEMP/reasons" >&2; exit 1; }
      - name: The CLI builds and checks the installed MobileBuildMCP
        run: bin/xcrew doctor --check mobilebuildmcp/version
      - name: MobileBuildMCP still accepts the config xcrew writes
        run: |
          project=$(mktemp -d)
          mkdir "$project/App.xcworkspace"
          MCS_PROJECT_PATH="$project" bin/xcrew setup --test-simulator "iPhone 17"
          log=$(mktemp)
          # Through the plugin's launcher, as Claude Code starts the server. The project pins no Xcode, so the server
          # starts unchanged: nothing of the launcher's on its standard error, and no launch record.
          ("$PWD/libexec/mobilebuildmcp-server" "$project" < /dev/null > /dev/null 2> "$log" &) ; sleep 5
          grep -E "Loaded project config|Registered [0-9]+ tools from workflows: .*sim-env" "$log" || { cat "$log"; exit 1; }
          if grep -F "mobilebuildmcp-server" "$log"; then echo "the launcher wrote to the server's standard error" >&2; exit 1; fi
          record="${XCREW_CACHE:-$HOME/Library/Caches/xcrew}/launches$(cd "$project" && pwd -P).launch"
          if [ -e "$record" ]; then echo "a launch record for a project with no pin: $(cat "$record")" >&2; exit 1; fi
      - name: The README's images still load
        run: scripts/readme-images.sh 2> "$RUNNER_TEMP/reasons" || { cat "$RUNNER_TEMP/reasons" >&2; exit 1; }
      - name: Sosumi answers
        run: |
          curl --fail --silent --show-error --max-time 20 -o /dev/null https://sosumi.ai/mcp -X POST -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"xcrew-canary","version":"0"}}}'
      - name: Open an issue when something broke
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="The weekly canary failed against the newest upstream versions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -s "$RUNNER_TEMP/reasons" ]; then body=$(printf '%s\n\n%s' "$body" "$(cat "$RUNNER_TEMP/reasons")"); fi
          gh issue create --title "Canary failed $(date -u +%Y-%m-%d)" --label canary --body "$body" \
            || gh issue create --title "Canary failed $(date -u +%Y-%m-%d)" --body "$body"
