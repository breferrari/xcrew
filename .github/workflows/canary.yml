# Runs xcrew against the newest Claude Code, MobileBuildMCP and Xcode every week, so upstream
# changes surface here, as an issue, before they surface in someone's session.
name: Canary

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Use the newest Xcode on the runner
        run: |
          sudo xcode-select -s "$(printf '%s\n' /Applications/Xcode_*.app | sort -V | tail -1)"
          swift --version
      - name: Install the newest Claude Code and MobileBuildMCP
        run: |
          npm install --global @anthropic-ai/claude-code@latest
          brew install getsentry/xcodebuildmcp/mobilebuildmcp
          claude --version
          mobilebuildmcp --version
      - name: Swift tests
        run: swift test
      - name: Plugin validation and mod tests
        run: |
          claude plugin validate .
          claude plugin test .
      - name: The CLI builds and checks the installed MobileBuildMCP
        run: bin/xcrew doctor --check mobilebuildmcp/version
      - name: MobileBuildMCP still accepts the config xcrew writes
        run: |
          project=$(mktemp -d)
          mkdir "$project/App.xcworkspace"
          MCS_PROJECT_PATH="$project" bin/xcrew setup --test-simulator "iPhone 17"
          cd "$project"
          log=$(mktemp)
          (mobilebuildmcp mcp < /dev/null > /dev/null 2> "$log" &) ; sleep 5
          grep -E "Loaded project config|Registered [0-9]+ tools from workflows: .*xcode-ide" "$log" || { cat "$log"; exit 1; }
      - name: Sosumi answers
        run: |
          curl --fail --silent --show-error --max-time 20 -o /dev/null https://sosumi.ai/mcp -X POST -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"xcrew-canary","version":"0"}}}'
      - name: Open an issue when something broke
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Canary failed $(date -u +%Y-%m-%d)" --label canary \
            --body "The weekly canary failed against the newest upstream versions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || gh issue create --title "Canary failed $(date -u +%Y-%m-%d)" \
            --body "The weekly canary failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
