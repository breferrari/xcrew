name: Report something
description: Something Xcrew did that you didn't expect
body:
  - type: textarea
    id: what
    attributes:
      label: What you expected, and what happened
      description: Two lines is enough.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `xcrew doctor` (optional)
      description: Run `/xcrew doctor` in the affected project, or the CLI under `~/.claude/plugins/…/bin/xcrew`.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions (optional)
      description: "`sw_vers -productVersion`, `xcodebuild -version`, `claude --version`, `mobilebuildmcp --version`"
  - type: dropdown
    id: install
    attributes:
      label: Installed through (optional)
      options:
        - Claude Code plugin
        - mcs
