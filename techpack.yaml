schemaVersion: 1
identifier: xcrew
displayName: Xcrew
description: "Your Xcode crew inside Claude Code: three MCP servers working as one, with live build progress and test reports Claude can act on."
author: Brenno Ferrari
minMCSVersion: "2026.10.30"

# The Claude Code plugin carries the servers, hooks, skills and mod; this pack installs it with
# the Homebrew package it needs, asks which workspace to build, and runs the checks. The
# simulator defaults to the newest iPhone installed; /xcrew:setup finds the schemes.
# Tests/ManifestTests keeps the prompts and checks in step with the Swift CLI.
ignore:
  # Nothing the plugin runs belongs here: mcs never announces an update for a change under an ignored path.
  - Tests/
  - docs/
  - CONTRIBUTING.md
  - SECURITY.md
  - CHANGELOG.md
  - CLAUDE.md
  - tsconfig.json
  - scripts/

prompts:
  - key: PROJECT
    type: fileDetect
    label: "Workspace or project Claude should build"
    detectPattern:
      - "*.xcworkspace"
      - "*.xcodeproj"

components:
  - id: mobilebuildmcp
    displayName: MobileBuildMCP
    description: Sentry's build, test, simulator, UI-automation and LLDB server (formerly XcodeBuildMCP)
    brew: getsentry/xcodebuildmcp/mobilebuildmcp

  - id: plugin
    displayName: xcrew plugin
    description: The MCP servers, hooks, skills and mod
    plugin: "xcrew@pack"

  - id: gitignore
    description: MobileBuildMCP's per-project config folder
    gitignore:
      - .mobilebuildmcp

configureProject:
  script: mcs/configure.sh

supplementaryDoctorChecks:
  - type: shellScript
    name: MobileBuildMCP 2.7.1 or newer
    section: xcrew
    command: mcs/checks/mobilebuildmcp--version.sh
    fixCommand: "brew upgrade getsentry/xcodebuildmcp/mobilebuildmcp"
  - type: shellScript
    name: No old xcodebuildmcp on PATH
    section: xcrew
    command: mcs/checks/mobilebuildmcp--no-legacy-binary.sh
  - type: shellScript
    name: MobileBuildMCP project config
    section: xcrew
    command: mcs/checks/mobilebuildmcp--project-config.sh
  - type: shellScript
    name: MobileBuildMCP has the current config
    section: xcrew
    command: mcs/checks/mobilebuildmcp--config-loaded.sh
  - type: shellScript
    name: No xcodebuild left running for this project
    section: xcrew
    command: mcs/checks/mobilebuildmcp--no-xcodebuild-left.sh
  - type: shellScript
    name: Configured simulators exist
    section: xcrew
    command: mcs/checks/mobilebuildmcp--simulators.sh
  - type: shellScript
    name: No simulators left by removed worktrees
    section: xcrew
    command: mcs/checks/simulators--worktree-leftovers.sh
  - type: shellScript
    name: Booted simulators fit this Mac's memory
    section: xcrew
    command: mcs/checks/simulators--memory.sh
  - type: shellScript
    name: This project's MobileBuildMCP storage is within its budget
    section: xcrew
    command: mcs/checks/mobilebuildmcp--storage.sh
  - type: shellScript
    name: The project's Xcode pin applies
    section: xcrew
    command: mcs/checks/xcode--pin.sh
  - type: shellScript
    name: CI uses the project's Xcode
    section: xcrew
    command: mcs/checks/xcode--ci.sh
  - type: shellScript
    name: The open Xcode is the one builds use
    section: xcrew
    command: mcs/checks/xcode--open.sh
  - type: shellScript
    name: Headless Xcode MCP enabled
    section: xcrew
    command: mcs/checks/xcode-mcp--headless-enabled.sh
  - type: shellScript
    name: A new Xcode MCP bridge answers
    section: xcrew
    command: mcs/checks/xcode-mcp--handshake.sh
  - type: shellScript
    name: Claude Code approved in Xcode
    section: xcrew
    command: mcs/checks/xcode-mcp--claude-approved.sh
  - type: shellScript
    name: Xcode refuses unsigned agents
    section: xcrew
    command: mcs/checks/xcode-mcp--unsigned-agents-off.sh
    fixCommand: "defaults write com.apple.dt.Xcode IDEAllowUnauthenticatedAgents -bool NO"
  - type: shellScript
    name: No in-place macro copy phase
    section: xcrew
    command: mcs/checks/xcode-mcp--macro-copy-phase.sh
