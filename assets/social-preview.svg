<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="glow" cx="0.3" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#161c25"/>
      <stop offset="1" stop-color="#0b0e12"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1280" height="640"/></clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- Mark, wordmark, rule and tagline. -->
  <image x="84" y="132" width="150" height="150" xlink:href="screw.png"/>
  <text x="88" y="386" font-family="Helvetica Neue" font-weight="bold" font-size="116" letter-spacing="-2" fill="#f3f4f6">Xcrew</text>
  <line x1="92" y1="424" x2="212" y2="424" stroke="#ec501d" stroke-width="2.5"/>
  <g font-family="Helvetica Neue" font-weight="500" font-size="27" letter-spacing="6" fill="#a9afb9">
    <text x="92" y="478">YOUR XCODE CREW</text>
    <text x="92" y="518">INSIDE CLAUDE CODE</text>
  </g>

  <!-- An Xcode-like editor, drawn rather than captured, coming in from the right. -->
  <g clip-path="url(#card)">
    <g filter="url(#shadow)" transform="translate(560 64)">
      <rect width="800" height="400" rx="14" fill="#1f2025" stroke="#3a3d45" stroke-width="1.5"/>
      <path d="M0 14 A14 14 0 0 1 14 0 H800 V40 H0 Z" fill="#26282e"/>
      <line x1="0" y1="40" x2="800" y2="40" stroke="#34363d"/>
      <circle cx="24" cy="20" r="6.5" fill="#ff5f57"/><circle cx="46" cy="20" r="6.5" fill="#febc2e"/><circle cx="68" cy="20" r="6.5" fill="#28c840"/>
      <path d="M100 13 L111 20 L100 27 Z" fill="#c9ccd3"/>
      <rect x="250" y="8" width="196" height="24" rx="12" fill="#1c1d22" stroke="#3a3d45"/>
      <text x="348" y="25" text-anchor="middle" font-family="Helvetica Neue" font-size="13" fill="#d7dae0">MyApp  ›  iPhone 17</text>
      <rect x="1" y="41" width="170" height="358" fill="#232429"/>
      <line x1="171" y1="41" x2="171" y2="399" stroke="#34363d"/>
      <g font-family="Helvetica Neue" font-size="13" fill="#d7dae0">
        <text x="18" y="70">▾  MyApp</text>
        <rect x="32" y="80" width="11" height="13" rx="2.5" fill="none" stroke="#8b949e" stroke-width="1.3"/><text x="51" y="91">Order.swift</text>
        <rect x="28" y="100" width="136" height="22" rx="5" fill="#2f4b78"/>
        <rect x="32" y="104" width="11" height="13" rx="2.5" fill="none" stroke="#c9d5ea" stroke-width="1.3"/><text x="51" y="116" fill="#ffffff">RefundTests.swift</text>
        <rect x="32" y="130" width="11" height="13" rx="2.5" fill="none" stroke="#8b949e" stroke-width="1.3"/><text x="51" y="141">ContentView.swift</text>
        <text x="18" y="176">▸  Packages</text>
      </g>
      <g font-family="Menlo" font-size="14">
        <g fill="#6c7079" text-anchor="end">
          <text x="204" y="74">1</text><text x="204" y="98">2</text><text x="204" y="122">3</text><text x="204" y="146">4</text><text x="204" y="170">5</text><text x="204" y="194">6</text>
        </g>
        <text x="220" y="74"><tspan fill="#ff7ab2">import</tspan><tspan fill="#d7dae0"> Testing</tspan></text>
        <text x="220" y="122"><tspan fill="#ff7ab2">@Test func</tspan><tspan fill="#67b7a4"> refundsAreNeverNegative</tspan><tspan fill="#d7dae0">() {</tspan></text>
        <text x="220" y="146"><tspan fill="#d7dae0">    </tspan><tspan fill="#ff7ab2">let</tspan><tspan fill="#d7dae0"> order = </tspan><tspan fill="#67b7a4">Order</tspan><tspan fill="#d7dae0">(total: </tspan><tspan fill="#d9c97c">42</tspan><tspan fill="#d7dae0">)</tspan></text>
        <text x="220" y="170"><tspan fill="#d7dae0">    </tspan><tspan fill="#ec501d">#expect</tspan><tspan fill="#d7dae0">(order.</tspan><tspan fill="#67b7a4">refund</tspan><tspan fill="#d7dae0">(</tspan><tspan fill="#d9c97c">50</tspan><tspan fill="#d7dae0">) == </tspan><tspan fill="#d9c97c">0</tspan><tspan fill="#d7dae0">)</tspan></text>
        <text x="220" y="194" fill="#d7dae0">}</text>
      </g>
    </g>

    <!-- Claude Code in a terminal, in front: Xcrew's band and the result rows. -->
    <g filter="url(#shadow)" transform="translate(600 244)">
      <rect width="640" height="340" rx="12" fill="#101216" stroke="#3a3d45" stroke-width="1.5"/>
      <path d="M0 12 A12 12 0 0 1 12 0 H628 A12 12 0 0 1 640 12 V34 H0 Z" fill="#1b1d22"/>
      <circle cx="20" cy="17" r="5.5" fill="#ff5f57"/><circle cx="38" cy="17" r="5.5" fill="#febc2e"/><circle cx="56" cy="17" r="5.5" fill="#28c840"/>
      <text x="320" y="22" text-anchor="middle" font-family="Helvetica Neue" font-size="12" fill="#8b929c">claude — MyApp</text>
      <g font-family="Menlo" font-size="13.5">
        <text x="22" y="66"><tspan fill="#f3f4f6">⏺</tspan><tspan fill="#d7dae0"> Running the refund tests on the simulator.</tspan></text>
        <text x="22" y="92"><tspan fill="#3fb950">⏺</tspan><tspan fill="#f3f4f6" font-weight="bold"> MobileBuildMCP</tspan><tspan fill="#8b929c"> · test_sim</tspan></text>
        <text x="22" y="114"><tspan fill="#8b929c">  ⎿  </tspan><tspan fill="#f85149">✗ 1 of 412 failed · RefundTests/refundsAreNeverNegative</tspan></text>
        <text x="22" y="140"><tspan fill="#f3f4f6">⏺</tspan><tspan fill="#d7dae0"> A refund larger than the total goes negative.</tspan></text>
        <text x="22" y="160" fill="#d7dae0">  Clamping it in Order.refund(_:), then rerunning.</text>
        <text x="22" y="186"><tspan fill="#3fb950">⏺</tspan><tspan fill="#f3f4f6" font-weight="bold"> MobileBuildMCP</tspan><tspan fill="#8b929c"> · test_sim</tspan></text>
        <text x="22" y="208"><tspan fill="#8b929c">  ⎿  </tspan><tspan fill="#3fb950">✓ 412 passed</tspan></text>

        <!-- Xcrew's band above the prompt. -->
        <rect x="14" y="228" width="612" height="30" rx="6" fill="#171a20"/>
        <text x="26" y="248"><tspan fill="#3fb950">✓</tspan><tspan fill="#f3f4f6" font-weight="bold"> test_sim</tspan><tspan fill="#8b929c"> · MyApp on iPhone 17 · 1:12</tspan><tspan fill="#ec501d"> (avg 1:05)</tspan><tspan fill="#8b929c"> · 412 passed</tspan></text>

        <rect x="14" y="268" width="612" height="34" rx="6" fill="none" stroke="#4a4f59" stroke-width="1"/>
        <text x="28" y="290" fill="#d7dae0">❯ <tspan fill="#6c7079">commit the fix</tspan></text>
        <text x="22" y="324" font-size="12"><tspan fill="#c792ea">Opus 5.5</tspan><tspan fill="#6c7079">  ·  </tspan><tspan fill="#82aaff">MyApp</tspan><tspan fill="#6c7079">  ·  </tspan><tspan fill="#d7dae0">main</tspan></text>
      </g>
    </g>
  </g>

  <!-- The banner's frame, on top. -->
  <rect x="6" y="6" width="1268" height="628" fill="none" stroke="#ec501d" stroke-opacity="0.35" stroke-width="2"/>
  <g fill="none" stroke="#ec501d" stroke-width="5" stroke-linecap="square">
    <path d="M8 52 V8 H52"/>
    <path d="M1228 8 H1272 V52"/>
    <path d="M8 588 V632 H52"/>
    <path d="M1228 632 H1272 V588"/>
  </g>
</svg>
